name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STORAGE_POSTGRES_URL: ${{ secrets.STORAGE_POSTGRES_URL }}
      STORAGE_PRISMA_DATABASE_URL: ${{ secrets.STORAGE_PRISMA_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: API integration tests
        run: npm run test:api

      - name: Check database env for build
        run: |
          if [ -z "${POSTGRES_URL}${DATABASE_URL}${STORAGE_POSTGRES_URL}${STORAGE_PRISMA_DATABASE_URL}" ]; then
            echo "Missing database connection secret for CI build. Set one of POSTGRES_URL, DATABASE_URL, STORAGE_POSTGRES_URL, or STORAGE_PRISMA_DATABASE_URL in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Build
        run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: quality
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STORAGE_POSTGRES_URL: ${{ secrets.STORAGE_POSTGRES_URL }}
      STORAGE_PRISMA_DATABASE_URL: ${{ secrets.STORAGE_PRISMA_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          E2E_USERNAME: marlie
          E2E_PASSWORD: password123
        run: npm run test:e2e
